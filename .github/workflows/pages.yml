# Project website: builds site/ with Scripts/build-site.sh and deploys it to GitHub Pages.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions". Only the files the
# script copies are published; docs/ itself is not.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'Bench/usb.svg'
      - 'Bench/usb-dark.svg'
      - 'VERSION'
      - 'Scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: Scripts/build-site.sh build/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
