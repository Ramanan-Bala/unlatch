# Engine CI: builds libntfs-3g and the engine, runs the engine tests, golden images, fsx
# regressions plus a short soak, and both fuzzers. Mounting is not tested in CI: it needs
# macFUSE's extension enabled in System Settings (docs/dev-setup.md).
name: engine

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: xcode-27          # macOS 27 + Xcode 27 (GitHub preview image)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Tools
        run: |
          brew install xcodegen
          brew install --cask macfuse      # headers and libfuse3 for unlatch-fuse (D-40); nothing is mounted

      - name: Cache libntfs-3g
        uses: actions/cache@v4
        with:
          path: |
            build/ntfs3g
            build/ntfs3g-fuzz
          key: ntfs3g-${{ runner.os }}-${{ hashFiles('Engine/vendor/VERSION', 'Engine/vendor/patches/**', 'Scripts/build-ntfs3g.sh') }}

      - name: Build libntfs-3g
        timeout-minutes: 15
        run: |
          [ -f build/ntfs3g/lib/libntfs-3g.a ] || Scripts/build-ntfs3g.sh
          [ -f build/ntfs3g-fuzz/lib/libntfs-3g.a ] || Scripts/build-ntfs3g.sh --fuzz

      - name: Bootstrap and build all Xcode targets
        run: |
          Scripts/bootstrap.sh
          xcodebuild -quiet -scheme Unlatch -derivedDataPath build/DerivedData build

      - name: Swift packages
        run: |
          swift test --package-path Shared
          swift build --package-path CLI

      - name: Engine tests (without the 4 GiB checks)
        env:
          UNLATCH_SKIP_BIG: "1"
        run: Scripts/test-engine.sh

      - name: Golden images
        run: Scripts/test-golden.sh

      - name: fsx regressions and a short soak
        run: |
          Scripts/fsx-soak.sh --regressions
          Scripts/fsx-soak.sh --seeds 100 --start "$(( RANDOM % 100000 + 1 ))"

      - name: Fuzz (60 s per target)
        timeout-minutes: 10
        run: |
          # ASan programs built with Homebrew LLVM have hung at startup on this runner (the
          # sanitizer configure tests, then the fuzzers). Check with a trivial one first.
          cc="$(brew --prefix llvm)/bin/clang"
          echo 'int main(void) { return 0; }' > /tmp/asan.c
          "$cc" -fsanitize=address -isysroot "$(xcrun --show-sdk-path)" -o /tmp/asan /tmp/asan.c
          if ! perl -e 'alarm 30; exec @ARGV' /tmp/asan; then
            echo "::warning::ASan programs do not start on this runner; fuzzing skipped (run Scripts/fuzz.sh locally)"
            exit 0
          fi
          Scripts/fuzz.sh --time 60

      - name: Keep failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: |
            build/fuzz/artifacts/
            build/fsx/fail-*
            Tests/fsx-regressions.txt
          if-no-files-found: ignore
