# XcodeGen spec. Regenerate with Scripts/bootstrap.sh (the .xcodeproj is not committed).
name: Unlatch

options:
  bundleIdPrefix: io.github.ramanan-bala
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  UnlatchCore:
    path: Shared

settings:
  base:
    BUNDLE_PREFIX: io.github.ramanan-bala
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_C_LANGUAGE_STANDARD: c11
    # Signing comes from Config/Base.xcconfig (+ optional Config/Local.xcconfig), D-37.
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Unlatch:
    type: application
    platform: macOS
    sources: [App/Sources]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Unlatch
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Unlatch contributors. GPL-3.0-or-later."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).Unlatch
        # Empty unless Config/Local.xcconfig sets a team (D-06, D-37).
        CODE_SIGN_ENTITLEMENTS: $(UNLATCH_APP_ENTITLEMENTS)
    dependencies:
      - target: UnlatchFSModule
        embed: true
        codeSign: true
      - target: unlatch-engine
        embed: false
        link: false

  UnlatchFSModule:
    type: extensionkit-extension
    platform: macOS
    sources: [Extension/Sources]
    info:
      path: Extension/Resources/Info.plist
      properties:
        CFBundleDisplayName: Unlatch
        # Modeled on Apple's exFAT FSKit module (D-36): probed on MBR NTFS partitions, GPT
        # basic-data partitions and partitionless disks (image files attach that way).
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: unlatch
          FSSupportsBlockResources: true
          FSSupportsGenericURLResources: false
          FSSupportsPathURLs: false
          FSSupportsServerURLs: false
          FSRequiresSecurityScopedPathURLResources: false
          FSVolumeAlwaysIgnoreOwnership: true
          FSActivateOptionSyntax:
            shortOptions: "g:m:o:u:"
          FSCheckOptionSyntax:
            shortOptions: "nqy"
          FSFormatOptionSyntax:
            shortOptions: "v"
          FSPersonalities:
            Unlatch:
              FSName: "NTFS (Unlatch)"
              FSfileObjectsAreCaseSensitive: false
          FSMediaTypes:
            Windows_NTFS:
              FSMediaProperties:
                Content Hint: Windows_NTFS
                Leaf: true
              FSProbeOrder: 2000
            EBD0A0A2-B9E5-4433-87C0-68B6B72699C7:
              FSMediaProperties:
                Content Hint: EBD0A0A2-B9E5-4433-87C0-68B6B72699C7
                Leaf: true
              FSProbeOrder: 2000
            Partitionless:
              FSMediaProperties:
                Leaf: true
                Whole: true
              FSProbeOrder: 4000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).Unlatch.FSModule
        PRODUCT_NAME: UnlatchFSModule
        CODE_SIGN_ENTITLEMENTS: $(UNLATCH_EXT_ENTITLEMENTS)
        # `import UnlatchEngineC` (Engine/include/module.modulemap)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Engine/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/include
    dependencies:
      - target: UnlatchEngine
      - package: UnlatchCore
      - sdk: FSKit.framework

  UnlatchEngine:
    type: library.static
    platform: macOS
    sources:
      - path: Engine/src
        excludes: ["fixtures/**"]      # test tooling, built by Scripts/test-engine.sh
      - path: Engine/include
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: UnlatchEngine
        # ntfs-3g headers are visible to this target only (built by Scripts/build-ntfs3g.sh).
        # -isystem keeps upstream header warnings out of our -Werror build (D-13).
        HEADER_SEARCH_PATHS: [$(SRCROOT)/Engine/include, $(SRCROOT)/build/ntfs3g/config]
        GCC_PREPROCESSOR_DEFINITIONS: ["HAVE_CONFIG_H=1", "$(inherited)"]
        OTHER_CFLAGS: [-Wall, -Wextra, -Werror, -isystem, $(SRCROOT)/build/ntfs3g/include]
        # Merge libntfs-3g.a into libUnlatchEngine.a so consumers link one archive (D-11).
        OTHER_LIBTOOLFLAGS: $(SRCROOT)/build/ntfs3g/lib/libntfs-3g.a
    preBuildScripts:
      - name: Check libntfs-3g
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/build/ntfs3g/lib/libntfs-3g.a" ] || [ ! -f "$SRCROOT/build/ntfs3g/config/config.h" ]; then
            echo "error: build/ntfs3g (libntfs-3g.a or config/config.h) missing. Run Scripts/bootstrap.sh or Scripts/build-ntfs3g.sh."
            exit 1
          fi

  unlatch-engine:
    type: tool
    platform: macOS
    sources: [EngineTool]
    settings:
      base:
        PRODUCT_NAME: unlatch-engine
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/include
        OTHER_CFLAGS: [-Wall, -Wextra, -Werror]
    dependencies:
      - target: UnlatchEngine

schemes:
  Unlatch:
    build:
      targets:
        Unlatch: all
        UnlatchFSModule: all
        UnlatchEngine: all
        unlatch-engine: all
  unlatch-engine:
    build:
      targets:
        UnlatchEngine: all
        unlatch-engine: all
