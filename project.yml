# XcodeGen spec. Regenerate with Scripts/bootstrap.sh (the .xcodeproj is not committed).
name: Unlatch

options:
  bundleIdPrefix: io.github.ramanan-bala
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  UnlatchCore:
    path: Shared
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.5.0"

settings:
  base:
    BUNDLE_PREFIX: io.github.ramanan-bala
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_C_LANGUAGE_STANDARD: c11
    # Signing comes from Config/Base.xcconfig (+ optional Config/Local.xcconfig), D-37.
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0-beta.13"
    # Finder and Launch Services want X.Y.Z in CFBundleShortVersionString; the full version
    # (with any -beta.N) is in UnlatchVersion. Both written by Scripts/set-version.sh.
    UNLATCH_SHORT_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "14"

targets:
  Unlatch:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources/Assets.xcassets, App/Resources/selftest.img]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Unlatch
        CFBundleShortVersionString: $(UNLATCH_SHORT_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UnlatchVersion: $(MARKETING_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Unlatch contributors. GPL-3.0-or-later."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).Unlatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty unless Config/Local.xcconfig sets a team (D-06, D-37).
        CODE_SIGN_ENTITLEMENTS: $(UNLATCH_APP_ENTITLEMENTS)
    # The app carries unlatch-fuse, the helper and the CLI in Contents/Helpers. Not in
    # Contents/MacOS: on a case-insensitive disk the CLI "unlatch" is the app's own "Unlatch". The FSKit module is no longer embedded: it needs a paid
    # team (D-38) and mounting goes through macFUSE (D-39).
    dependencies:
      - package: UnlatchCore
      - target: unlatch-fuse
        embed: false
        link: false
      - target: unlatch-helper
        embed: false
        link: false
      - target: unlatch-cli
        embed: false
        link: false
    postBuildScripts:
      - name: Third-party notices into the app
        script: |
          "$SRCROOT/Scripts/make-notices.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Notices" > /dev/null
        basedOnDependencyAnalysis: false
      - name: Copy unlatch-fuse, helper and CLI into the app
        script: |
          dest="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$dest"
          for f in unlatch-fuse io.github.ramanan-bala.unlatch.helper unlatch; do
            cp -f "$BUILT_PRODUCTS_DIR/$f" "$dest/$f"
            codesign --force --sign - "$dest/$f" 2>/dev/null || true
          done
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/unlatch-fuse
          - $(BUILT_PRODUCTS_DIR)/io.github.ramanan-bala.unlatch.helper
          - $(BUILT_PRODUCTS_DIR)/unlatch
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/unlatch-fuse
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/io.github.ramanan-bala.unlatch.helper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/unlatch

  UnlatchFSModule:
    type: extensionkit-extension
    platform: macOS
    sources: [Extension/Sources]
    info:
      path: Extension/Resources/Info.plist
      properties:
        CFBundleDisplayName: Unlatch
        CFBundleShortVersionString: $(UNLATCH_SHORT_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Modeled on Apple's exFAT FSKit module (D-36): probed on MBR NTFS partitions, GPT
        # basic-data partitions and partitionless disks (image files attach that way).
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: unlatch
          FSSupportsBlockResources: true
          FSSupportsGenericURLResources: false
          FSSupportsPathURLs: false
          FSSupportsServerURLs: false
          FSRequiresSecurityScopedPathURLResources: false
          FSVolumeAlwaysIgnoreOwnership: true
          FSActivateOptionSyntax:
            shortOptions: "g:m:o:u:"
          FSCheckOptionSyntax:
            shortOptions: "nqy"
          FSFormatOptionSyntax:
            shortOptions: "v"
          FSPersonalities:
            Unlatch:
              FSName: "NTFS (Unlatch)"
              FSfileObjectsAreCaseSensitive: false
          FSMediaTypes:
            Windows_NTFS:
              FSMediaProperties:
                Content Hint: Windows_NTFS
                Leaf: true
              FSProbeOrder: 2000
            EBD0A0A2-B9E5-4433-87C0-68B6B72699C7:
              FSMediaProperties:
                Content Hint: EBD0A0A2-B9E5-4433-87C0-68B6B72699C7
                Leaf: true
              FSProbeOrder: 2000
            Partitionless:
              FSMediaProperties:
                Leaf: true
                Whole: true
              FSProbeOrder: 4000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).Unlatch.FSModule
        PRODUCT_NAME: UnlatchFSModule
        CODE_SIGN_ENTITLEMENTS: $(UNLATCH_EXT_ENTITLEMENTS)
        # `import UnlatchEngineC` (Engine/include/module.modulemap)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Engine/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/include
    dependencies:
      - target: UnlatchEngine
      - package: UnlatchCore
      - sdk: FSKit.framework

  UnlatchEngine:
    type: library.static
    platform: macOS
    sources:
      - path: Engine/src
        excludes: ["fixtures/**"]      # test tooling, built by Scripts/test-engine.sh
      - path: Engine/include
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: UnlatchEngine
        # ntfs-3g headers are visible to this target only (built by Scripts/build-ntfs3g.sh).
        # -isystem keeps upstream header warnings out of our -Werror build (D-13).
        HEADER_SEARCH_PATHS: [$(SRCROOT)/Engine/include, $(SRCROOT)/build/ntfs3g/config]
        GCC_PREPROCESSOR_DEFINITIONS: ["HAVE_CONFIG_H=1", "$(inherited)"]
        OTHER_CFLAGS: [-Wall, -Wextra, -Werror, -isystem, $(SRCROOT)/build/ntfs3g/include]
        # Merge libntfs-3g.a into libUnlatchEngine.a so consumers link one archive (D-11).
        OTHER_LIBTOOLFLAGS: $(SRCROOT)/build/ntfs3g/lib/libntfs-3g.a
    preBuildScripts:
      - name: Check libntfs-3g
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/build/ntfs3g/lib/libntfs-3g.a" ] || [ ! -f "$SRCROOT/build/ntfs3g/config/config.h" ]; then
            echo "error: build/ntfs3g (libntfs-3g.a or config/config.h) missing. Run Scripts/bootstrap.sh or Scripts/build-ntfs3g.sh."
            exit 1
          fi

  unlatch-engine:
    type: tool
    platform: macOS
    sources: [EngineTool]
    settings:
      base:
        PRODUCT_NAME: unlatch-engine
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/include
        OTHER_CFLAGS: [-Wall, -Wextra, -Werror]
    dependencies:
      - target: UnlatchEngine

  unlatch-fuse:
    type: tool
    platform: macOS
    sources:
      - Fuse
      - path: EngineTool/file_io.c
      - path: EngineTool/file_io.h
      - path: EngineTool/check_report.c
      - path: EngineTool/check_report.h
    settings:
      base:
        PRODUCT_NAME: unlatch-fuse
        HEADER_SEARCH_PATHS: [$(SRCROOT)/Engine/include, $(SRCROOT)/EngineTool]
        # macFUSE's headers and libfuse3 (D-40); -isystem keeps -Werror off its headers.
        OTHER_CFLAGS: [-Wall, -Wextra, -Werror, -isystem, $(MACFUSE_PREFIX)/include/fuse3]
        LIBRARY_SEARCH_PATHS: $(MACFUSE_PREFIX)/lib
        OTHER_LDFLAGS: [-lfuse3, -framework, CoreFoundation, -framework, DiskArbitration]
        MACFUSE_PREFIX: /usr/local
    dependencies:
      - target: UnlatchEngine

  # The CLI as an Xcode target too, so the app can carry it (CLI/Package.swift is the
  # SwiftPM build of the same sources), compiled as one module.
  unlatch-cli:
    type: tool
    platform: macOS
    sources: [CLI/Sources/UnlatchCLI, CLI/Sources/unlatch]
    settings:
      base:
        PRODUCT_NAME: unlatch
        PRODUCT_MODULE_NAME: UnlatchCLI
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: UNLATCH_ONE_MODULE
    dependencies:
      - package: UnlatchCore
      - package: ArgumentParser

  unlatch-helper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
    settings:
      base:
        PRODUCT_NAME: io.github.ramanan-bala.unlatch.helper
        OTHER_CFLAGS: [-Wall, -Wextra, -Werror]
        OTHER_LDFLAGS: [-framework, CoreFoundation, -framework, DiskArbitration]

schemes:
  Unlatch:
    build:
      targets:
        Unlatch: all
        UnlatchFSModule: all
        UnlatchEngine: all
        unlatch-engine: all
        unlatch-fuse: all
        unlatch-helper: all
        unlatch-cli: all
  unlatch-engine:
    build:
      targets:
        UnlatchEngine: all
        unlatch-engine: all
